name: Build paradosp ARM64

on:
  push:
    branches:
      - dev
      - sonlh/dev
  workflow_dispatch:

jobs:
  build:
    name: Build standalone paradosp
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify ARM64 runner
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "aarch64"
          uname -a
          python --version

      - name: Install test and packaging tools
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pex==2.103.4" pytest pytest-asyncio

      - name: Run gateway tests
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest tests/interfaces/test_safelink.py tests/test_paradosp_app.py -q

      - name: Build standalone paradosp with embedded Python
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          pex . \
            --entry-point paradox.paradosp_app:main \
            --scie eager \
            --output-file dist/paradosp
          chmod 0755 dist/paradosp
          cp deploy/orange-pi/setup-orange-pi.sh dist/setup-orange-pi.sh

      - name: Verify standalone ARM64 application
        shell: bash
        run: |
          set -euxo pipefail
          test -f dist/paradosp
          test -f dist/setup-orange-pi.sh
          sh -n dist/setup-orange-pi.sh
          file dist/paradosp | tee dist/paradosp.file-info
          grep -q 'ELF 64-bit' dist/paradosp.file-info
          grep -Eq 'ARM aarch64|ARM64' dist/paradosp.file-info
          mkdir -p "${RUNNER_TEMP}/paradosp-home"
          env -i \
            HOME="${RUNNER_TEMP}/paradosp-home" \
            XDG_CACHE_HOME="${RUNNER_TEMP}/paradosp-home/.cache" \
            ./dist/paradosp --self-test

      - name: Upload paradosp
        uses: actions/upload-artifact@v7
        with:
          path: dist/paradosp
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Orange Pi setup
        uses: actions/upload-artifact@v7
        with:
          path: dist/setup-orange-pi.sh
          archive: false
          if-no-files-found: error
          retention-days: 30
